# Coolify / Nixpacks build — Bun + SvelteKit (adapter-node).
#
# No database, no persistent storage: templates live in the browser's
# localStorage and the printer is reached from the browser over Web Bluetooth,
# so the server only ever serves static assets and the SSR shell.
#
# Serve it over HTTPS. Web Bluetooth requires a secure context, so the Connect
# button is inert on a plain-http origin (localhost excepted).

[phases.setup]
# nodejs_22, not nodejs: on the pinned snapshot plain nodejs is Node 24.
nixPkgs = ["bun", "nodejs_22"]
# nixpacks' default nixpkgs snapshot ships Node 22.19, which bundles a Brotli
# decoder vulnerable to CVE-2026-111497. Pin the nixos-26.05 channel (cached
# on cache.nixos.org, so Node isn't built from source): Node 22.23.4.
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "node build"
