<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<title>printrow</title>
	<!--
		The wordmark's dot-matrix glyph: a 2x2 grid with one dot deliberately
		unprinted. Squares rather than circles, because a thermal head lays
		down square dots, and they stay legible at 16px.

		Inverts with the browser theme so it reads on either tab bar.
	-->
	<style>
		rect { fill: #171717 }
		@media (prefers-color-scheme: dark) { rect { fill: #fafafa } }
	</style>
	<rect x="3" y="3" width="11" height="11" rx="1" />
	<rect x="18" y="3" width="11" height="11" rx="1" />
	<rect x="3" y="18" width="11" height="11" rx="1" opacity=".25" />
	<rect x="18" y="18" width="11" height="11" rx="1" />
</svg>
